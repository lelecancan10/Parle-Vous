const L={
A1:{Grammaire:{"Articles et déterminants":"Les déterminants accompagnent les noms. Les articles définis sont le, la, l', les ; les indéfinis sont un, une, des. On utilise aussi des possessifs comme mon, ma, mes et des démonstratifs comme ce, cette, ces. Le déterminant s'accorde avec le nom.","Genre et nombre":"Les noms français sont masculins ou féminins et singuliers ou pluriels. Le déterminant et l'adjectif s'accordent avec le nom. Le pluriel prend souvent -s, mais certains mots sont irréguliers comme cheval → chevaux.",Négation:"La négation utilise souvent ne...pas. On peut aussi utiliser ne...jamais, ne...plus, ne...rien et ne...personne. À l'écrit, le ne est conservé.","Pronoms personnels":"Je, tu, il, elle, on, nous, vous, ils et elles remplacent un nom ou un groupe nominal et évitent les répétitions.","Prépositions de base":"Les prépositions fréquentes sont à, de, dans, sur, sous, chez, avec, sans, pour et en. Attention aux contractions : à + le = au et de + le = du."},Conjugaison:{Présent:"Le présent sert à parler d'une action actuelle, d'une habitude ou d'un fait général. Les verbes être, avoir, aller et faire sont essentiels.","Passé composé":"Le passé composé raconte généralement une action terminée. Il se forme avec avoir ou être au présent et un participe passé.","Futur proche":"Le futur proche se forme avec aller au présent + infinitif : je vais partir, nous allons travailler.","Être et avoir":"Être sert à exprimer une identité ou un état et comme auxiliaire. Avoir exprime notamment la possession et sert aussi d'auxiliaire."},Vocabulaire:{"Se présenter":"Pour se présenter, on peut donner son prénom, son âge, sa ville, ses études et ses goûts.",Famille:"Le vocabulaire familial comprend parents, frère, sœur, fils, fille, oncle, tante, cousin et grands-parents.","École et classe":"On parle de professeur, élève, cours, devoir, examen, cahier, matière et emploi du temps.",Maison:"Les pièces principales sont la cuisine, la chambre, le salon et la salle de bains. On peut aussi décrire les meubles et les objets.",Nourriture:"Le vocabulaire courant comprend pain, riz, légumes, fruits, viande, fromage, eau et boissons."}},
A2:{Grammaire:{"Adjectifs et accords":"L'adjectif s'accorde avec le nom en genre et en nombre. Il peut se placer avant ou après le nom selon l'adjectif et le sens.",Comparaison:"Pour comparer, on utilise plus...que, moins...que et aussi...que. On rencontre aussi meilleur, pire, le plus et le moins.","Pronoms compléments":"Les pronoms le, la, les, lui et leur remplacent des compléments. Ils se placent généralement avant le verbe conjugué.","Quantités et articles":"Après beaucoup de, peu de, assez de et trop de, on utilise généralement de ou d'. Les partitifs sont du, de la, de l' et des.","Questions et mots interrogatifs":"Qui, que, quoi, où, quand, pourquoi, comment et combien permettent de demander une information précise."},Conjugaison:{Imparfait:"L'imparfait sert à décrire une situation passée, une habitude ou une action en cours. Il se forme généralement à partir de nous au présent.","Futur simple":"Le futur simple se forme avec l'infinitif et les terminaisons -ai, -as, -a, -ons, -ez, -ont, avec quelques radicaux irréguliers.","Passé composé ou imparfait":"Le passé composé présente souvent l'événement terminé ; l'imparfait présente le contexte, une habitude ou une action en cours.","Verbes pronominaux":"Les verbes pronominaux utilisent me, te, se, nous, vous, se. Au passé composé, ils utilisent généralement être."},Vocabulaire:{"Voyage et transports":"On utilise billet, gare, aéroport, départ, arrivée, bagage, réservation et correspondance.","Ville et orientation":"On peut demander ou donner un itinéraire avec à gauche, à droite, tout droit, près de et en face de.","Achats et magasins":"On parle de prix, taille, couleur, modèle, caisse, reçu, réduction et paiement.",Météo:"On décrit la météo avec il fait chaud, il fait froid, il pleut, il neige, il y a du vent ou du soleil."}},
B1:{Grammaire:{"Condition et hypothèse":"Avec si + présent, la conséquence peut être au futur. Avec si + imparfait, elle est généralement au conditionnel. Le plus-que-parfait peut introduire une hypothèse passée.","Pronoms relatifs":"Qui est sujet, que est complément direct, dont remplace un complément avec de et où indique souvent un lieu ou un moment.","Discours indirect":"Le discours indirect rapporte des paroles sans les citer. Les pronoms, les temps et certains marqueurs de temps peuvent changer.","Connecteurs logiques":"Les connecteurs structurent un raisonnement : cependant, pourtant, en revanche, de plus, puisque, donc, ainsi et par conséquent."},Conjugaison:{"Conditionnel présent":"Le conditionnel exprime une hypothèse, un souhait, une demande polie ou une information prudente.","Plus-que-parfait":"Le plus-que-parfait exprime une action antérieure à une autre action passée. Il se forme avec l'imparfait de l'auxiliaire et le participe passé.","Futur et hypothèse":"Le futur et le conditionnel permettent de distinguer une hypothèse réalisable d'une situation imaginaire."},Vocabulaire:{"Travail et études":"On utilise emploi, métier, entreprise, candidature, entretien, diplôme, stage, formation et compétence.","Médias et information":"On parle de source, article, reportage, journaliste, actualité, réseau social, publication et opinion.","Relations sociales":"On peut parler de confiance, désaccord, soutien, conseil, respect, conflit, discussion et coopération."}},
B2:{Grammaire:{Subjonctif:"Le subjonctif apparaît après certaines expressions de volonté, nécessité, doute, sentiment ou jugement : il faut que, je veux que, bien que.","Concession et opposition":"La concession utilise notamment bien que, quoique, même si et malgré. L'opposition utilise cependant, pourtant, tandis que ou alors que.","Mise en relief":"C'est...qui, c'est...que, ce qui et ce que permettent d'insister sur une information.",Nominalisation:"La nominalisation transforme un verbe ou un adjectif en nom et est fréquente dans les écrits formels."},Conjugaison:{"Concordance des temps":"La concordance organise les temps entre une principale et une subordonnée, notamment dans le discours indirect.","Passé simple et récit":"Le passé simple est surtout littéraire et sert souvent à présenter les événements principaux d'un récit.","Subjonctif et indicatif":"Le choix dépend du sens et de la construction : certitude et constat favorisent souvent l'indicatif, doute ou volonté le subjonctif."},Vocabulaire:{Argumentation:"Argumenter consiste à présenter une idée, la justifier, donner des exemples et répondre éventuellement à une objection.","Société et environnement":"On peut parler de développement durable, pollution, biodiversité, énergie, transports, solidarité et inégalités.","Registre de langue":"Le registre courant convient à la majorité des situations ; familier et soutenu dépendent du contexte."}},
C1:{Grammaire:{"Nuances grammaticales":"À C1, on choisit une structure selon une nuance précise : certitude, doute, chronologie, concession, mise en valeur ou registre.","Structures complexes":"Les structures complexes combinent plusieurs propositions en maîtrisant les pronoms, les temps, les connecteurs et les relations logiques.","Inversion et style soutenu":"L'inversion et certaines tournures comme peut-être viendra-t-il appartiennent à des usages plus soutenus."},Conjugaison:{"Valeurs des temps":"Les temps peuvent exprimer une habitude, une narration, une antériorité, une hypothèse ou une prise de distance.","Passé antérieur et récit":"Le passé antérieur est principalement littéraire et exprime une action immédiatement antérieure à une autre au passé simple."},Vocabulaire:{"Expressions idiomatiques":"Les expressions idiomatiques ont un sens qui ne correspond pas toujours au sens littéral des mots.","Nuance et précision":"Un vocabulaire précis permet de distinguer des notions proches et de choisir le mot adapté au contexte.","Écriture argumentée":"Une bonne argumentation présente une idée directrice, des arguments, des exemples et une conclusion structurée."}}
};

const S=JSON.parse(localStorage.getItem("parleVous")||"{}");S.xp=+S.xp||0;S.done=+S.done||0;S.errors=Array.isArray(S.errors)?S.errors:[];S.history=S.history||{};let level="A1",cat="Grammaire",sub="Articles et déterminants",qs=[],i=0,score=0,locked=false;
function save(){localStorage.setItem("parleVous",JSON.stringify(S));document.getElementById("xp").textContent=S.xp}function sh(a){return [...a].sort(()=>Math.random()-.5)}function topics(){return Object.values(L).flatMap(x=>Object.values(x).flatMap(y=>Object.keys(y)))}function bank(t){let b=B[t]||[];if(!b.length)b=[["Quelle proposition correspond au thème « "+t+" » ?","La réponse adaptée au thème.",["Une réponse hors sujet.","Une autre réponse hors sujet.","Une proposition incorrecte."]]];let out=[];b.forEach((x,n)=>{out.push({q:x[0],c:x[1],w:x[2],id:t+n});out.push({q:x[0]+" — variante A",c:x[1],w:x[2],id:t+n+"a"});out.push({q:x[0]+" — variante B",c:x[1],w:x[2],id:t+n+"b"})});return out}
function makeQs(t){let p=bank(t),h=new Set(S.history[t]||[]),fresh=p.filter(x=>!h.has(x.id));if(fresh.length<25){S.history[t]=[];fresh=p}let take=sh(fresh).slice(0,25);S.history[t]=[...(S.history[t]||[]),...take.map(x=>x.id)].slice(-Math.max(0,p.length-1));save();return take.map(x=>({q:x.q,c:x.c,a:sh([x.c,...x.w])}))}
function home(){document.getElementById("view").innerHTML=`<section class="hero"><div><h2>Apprends le français autrement.</h2><p>Des leçons progressives et une grande banque d'exercices de A1 à C1.</p></div><button class="btn" onclick="catalog()">Commencer</button></section><div class="stats"><div class="stat"><b>${S.xp}</b><span class="muted">XP gagnés</span></div><div class="stat"><b>${S.done}</b><span class="muted">séries terminées</span></div><div class="stat"><b>${S.errors.length}</b><span class="muted">erreurs enregistrées</span></div><div class="stat"><b>${topics().length}</b><span class="muted">thèmes</span></div></div><div class="sectionhead"><h2>Ton parcours</h2></div><div class="grid">${Object.keys(L).map(x=>`<div class="card" onclick="choose('${x}')"><span class="tag">${x}</span><h3>${levelName(x)}</h3><p class="muted">${count(x)} thèmes.</p></div>`).join("")}</div>`;save()}function levelName(x){return({A1:"Débutant",A2:"Élémentaire",B1:"Intermédiaire",B2:"Avancé",C1:"Maîtrise"})[x]}function count(x){return Object.values(L[x]).reduce((n,c)=>n+Object.keys(c).length,0)}function choose(x){level=x;catalog()}function catalog(){document.getElementById("view").innerHTML=`<div class="sectionhead"><div><h2>Niveau ${level} — ${levelName(level)}</h2><p class="muted">Choisis une catégorie et un thème.</p></div><div class="filters">${Object.keys(L).map(x=>`<button class="pill ${x===level?'active':''}" onclick="choose('${x}')">${x}</button>`).join("")}</div></div>${Object.keys(L[level]).map(c=>`<section><div class="sectionhead"><h2>${c}</h2></div><div class="grid">${Object.keys(L[level][c]).map(s=>`<div class="card" onclick='openSub(${JSON.stringify(c)},${JSON.stringify(s)})'><span class="tag">${c}</span><h3>${s}</h3><p class="muted">Leçon + 25 questions par série.</p></div>`).join("")}</div></section>`).join("")}`}
function openSub(c,s){cat=c;sub=s;let d=L[level][c][s];document.getElementById("view").innerHTML=`<div class="sectionhead"><div><span class="tag">${level} · ${c}</span><h2>${s}</h2></div><button class="pill" onclick="catalog()">← Retour</button></div><article class="lesson"><h3>Leçon</h3><p>${d}</p><div class="example"><b>Exemple :</b> ${example(s)}</div><button class="btn" onclick="start()">▶ Commencer les 25 questions</button></article>`}function example(s){let e={"Articles et déterminants":"Cette maison est grande et mes amis ont un appartement.",Présent:"Je travaille tous les jours et nous faisons nos exercices.",Négation:"Je ne viens jamais sans mon cahier.",Subjonctif:"Il faut que tu sois prêt.",Comparaison:"Ce livre est plus intéressant que l'autre.","Condition et hypothèse":"Si j'avais le temps, je voyagerais davantage."};return e[s]||"Lis la règle, puis applique-la dans les exercices."}
function start(){qs=makeQs(sub);i=0;score=0;locked=false;show()}function show(){let q=qs[i];document.getElementById("view").innerHTML=`<div class="quiz"><div class="qtop"><span>${level} · ${sub}</span><span>${i+1} / 25</span></div><div class="progress"><i style="width:${(i+1)*4}%"></i></div><div class="question">${q.q}</div><div class="answers">${q.a.map((a,n)=>`<button class="answer" onclick="answer(${n})">${a}</button>`).join("")}</div><div class="feedback" id="feedback"></div><div class="quiznav"><button class="pill" onclick="catalog()">Quitter</button><button class="btn" id="next" disabled onclick="next()">${i===24?'Résultat':'Question suivante →'}</button></div></div>`}function answer(n){if(locked)return;locked=true;let q=qs[i],bs=[...document.querySelectorAll('.answer')],ok=q.a[n]===q.c;bs.forEach((b,k)=>{if(q.a[k]===q.c)b.classList.add('correct');else if(k===n)b.classList.add('wrong')});let f=document.getElementById('feedback');if(ok){score++;S.xp++;f.textContent='✓ Bonne réponse ! +1 XP';f.style.color='var(--ok)'}else{f.textContent='✗ Bonne réponse : '+q.c;f.style.color='var(--bad)';S.errors.unshift({level,cat,sub,question:q.q,answer:q.c});S.errors=S.errors.slice(0,100)}save();document.getElementById('next').disabled=false}function next(){if(i<24){i++;locked=false;show()}else result()}function result(){S.done++;save();let p=Math.round(score/25*100);document.getElementById('view').innerHTML=`<div class="result"><span class="tag">Série terminée</span><h2>Bravo !</h2><div style="font-size:55px;font-weight:900;color:var(--brand)">${score}/25</div><p>${p>=80?'Très bon travail !':p>=60?'Bonne progression !':'Continue à t’entraîner !'}</p><button class="btn" onclick="start()">Nouvelle série</button> <button class="pill" onclick='openSub(${JSON.stringify(cat)},${JSON.stringify(sub)})'>Revoir la leçon</button></div>`}
function mistakes(){document.getElementById('view').innerHTML=`<div class="sectionhead"><div><h2>Mes erreurs</h2><p class="muted">Tes dernières erreurs.</p></div></div><div class="card">${S.errors.length?S.errors.slice(0,40).map(e=>`<div class="mistake"><b>${e.level} · ${e.sub}</b><br>${e.question}<br><span style="color:var(--ok)">Réponse : ${e.answer}</span></div>`).join(''):'Aucune erreur enregistrée.'}</div>`}function about(){document.getElementById('view').innerHTML=`<div class="lesson"><span class="tag">Méthode</span><h2>Comment apprendre ?</h2><p>Chaque thème contient une leçon détaillée puis une série de 25 questions tirées aléatoirement d'une banque plus large. Les questions récentes sont mémorisées localement pour réduire les répétitions.</p><div class="example"><b>Conseil :</b> lis la leçon, fais la série, puis consulte « Mes erreurs ».</div></div>`}
function teacherLogin(){document.getElementById('view').innerHTML=`<div class="teacher"><span class="tag">Espace professeur</span><h2>Connexion professeur</h2><p class="muted">Cette protection est uniquement côté navigateur.</p><input id="pass" type="password" placeholder="Mot de passe" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:11px"><br><br><button class="btn" onclick="checkTeacher()">Se connecter</button><p id="msg"></p></div>`;document.getElementById('pass').focus()}function checkTeacher(){if(document.getElementById('pass').value==='PRONOTE')teacherPanel();else document.getElementById('msg').textContent='Mot de passe incorrect.'}function teacherPanel(){let d={};S.errors.forEach(e=>d[e.sub]=(d[e.sub]||0)+1);document.getElementById('view').innerHTML=`<div class="teacher"><span class="tag">Mode professeur</span><h2>Tableau de bord</h2><div class="teacher-grid"><div class="teacher-box"><b>${S.xp}</b><br>XP</div><div class="teacher-box"><b>${S.done}</b><br>séries</div><div class="teacher-box"><b>${S.errors.length}</b><br>erreurs</div></div><h3>Erreurs par thème</h3><div class="card">${Object.entries(d).sort((a,b)=>b[1]-a[1]).slice(0,15).map(x=>`<p><b>${x[0]}</b> — ${x[1]}</p>`).join('')||'Aucune donnée.'}</div><br><button class="btn" onclick="exportData()">Exporter JSON</button> <button class="pill" onclick="resetData()">Réinitialiser</button><p class="muted">Les données sont locales à ce navigateur. Pour gérer plusieurs élèves à distance, il faudrait un serveur ou une base de données.</p></div>`}function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parle-vous-donnees.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Réinitialiser toutes les données locales ?')){localStorage.removeItem('parleVous');location.reload()}}save();home();
</script></body></html>
