<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parle-vous ? — Académie de français</title><meta name="description" content="Apprends le français avec des exercices interactifs."><style>:root{--bg:#f5f7ff;--card:#fff;--text:#172033;--muted:#68738a;--brand:#5b5cf0;--ok:#18a66a;--bad:#e34d59;--line:#e7eaf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#10152b;color:#fff;padding:24px 16px}.brand{font-size:24px;font-weight:900;padding:10px 12px 25px}.brand span{color:#8b8cff}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd1e6;text-align:left;padding:13px 14px;border-radius:12px;margin:4px 0;cursor:pointer}.nav button:hover{background:#ffffff12;color:#fff}.main{max-width:1200px;width:100%;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.hello h1{margin:0;font-size:30px}.hello p{margin:5px 0;color:var(--muted)}.topright{display:flex;gap:10px;align-items:center}.xp{background:#10152b;color:#fff;padding:11px 15px;border-radius:13px;font-weight:800}.hero{background:linear-gradient(135deg,#4d50e8,#8a54e8);color:#fff;border-radius:25px;padding:30px;display:flex;justify-content:space-between;gap:25px;align-items:center}.hero h2{font-size:35px;margin:0 0 8px}.hero p{margin:0;opacity:.88;max-width:650px}.btn,.pill{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.btn{background:var(--brand);color:#fff}.hero .btn{background:#fff;color:#4d50e8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.card,.lesson,.quiz,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px}.stat b{font-size:25px;display:block}.muted{color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}.sectionhead h2{margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:var(--card)}.pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{cursor:pointer}.card:hover{transform:translateY(-2px)}.tag{display:inline-block;background:#eef0ff;color:#4d50e8;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:900}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#5b5cf0,#9a63ef);width:0}.lesson{line-height:1.7}.example{background:#f1f3ff;border-left:4px solid var(--brand);padding:14px;border-radius:10px;margin:15px 0}.quiz h2{font-size:25px}.answers{display:grid;gap:10px;margin:18px 0}.answer{border:2px solid var(--line);background:var(--card);padding:14px;border-radius:12px;text-align:left;cursor:pointer;transition:.15s}.answer:hover{border-color:var(--brand);transform:translateY(-1px)}.answer.good{border-color:var(--ok);background:#edfbf4;color:#126b45}.answer.bad{border-color:var(--bad);background:#fff0f2;color:#9f2530}.answer.locked{cursor:default}.feedback{min-height:28px;font-weight:800;margin-top:8px}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.app{display:block}.side{padding:12px}.brand{padding:8px}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:16px}.hero{display:block}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="app"><aside class="side"><div class="brand">Parle<span>-vous ?</span></div><nav class="nav"><button onclick="home()">⌂ Accueil</button><button onclick="catalog()">▣ Parcours</button><button onclick="mistakes()">↻ Mes erreurs</button><button onclick="about()">ⓘ Méthode</button></nav></aside><main class="main"><div class="top"><div class="hello"><h1 id="title">Bonjour 👋</h1><p>Ton espace pour progresser en français.</p></div><div class="topright"><div class="xp">⭐ <span id="xp">0</span> XP</div></div></div><div id="view"></div></main></div><script>const lessons={A1:{Grammaire:{Articles:['Les articles définis (le, la, les) désignent quelque chose de précis. Les indéfinis (un, une, des) présentent quelque chose.','J’aime le chocolat. / J’ai une voiture.'],Négation:['Pour nier, place généralement ne… pas autour du verbe.','Je parle. → Je ne parle pas.']},Conjugaison:{Présent:['Le présent sert à parler de maintenant ou d’habitudes.','Je travaille chaque jour.'],Passé:['Le passé composé raconte une action terminée.','J’ai terminé mon exercice.'],Futur:['Aller + infinitif forme le futur proche.','Je vais réviser.']},Vocabulaire:{Présentation:['Pour se présenter, donne ton prénom, ton lieu de vie et quelques goûts.','Je m’appelle Léa. J’habite à Monaco.'],Famille:['Famille : parent, frère, sœur, oncle, tante, cousin.','Ma sœur habite près de chez moi.']}},A2:{Grammaire:{Adjectifs:['L’adjectif s’accorde avec le nom en genre et en nombre.','Une petite maison / des petits livres.'],Comparaison:['Utilise plus… que, moins… que et aussi… que.','Paul est plus grand que Marc.']},Conjugaison:{Imparfait:['L’imparfait décrit une habitude ou une situation passée.','Quand j’étais petit, je jouais.'],Futur:['Le futur simple exprime une action à venir.','Demain, je partirai.']},Vocabulaire:{Voyage:['Billet, gare, départ, arrivée, réservation, hôtel.','Je réserve une chambre.']}},B1:{Grammaire:{Condition:['Si + imparfait peut introduire une hypothèse ; le conditionnel exprime sa conséquence.','Si j’avais le temps, je voyagerais.'],Relatives:['Qui, que, où et dont relient des propositions.','La ville où je vis est agréable.']},Conjugaison:{Conditionnel:['Le conditionnel sert pour l’hypothèse, le souhait ou une demande polie.','Je voudrais apprendre.']},Vocabulaire:{Travail:['Métier, poste, collègue, réunion, compétence, expérience.','Je cherche un emploi.']}},B2:{Grammaire:{Subjonctif:['Le subjonctif apparaît notamment après certaines expressions de nécessité, volonté ou doute.','Il faut que tu viennes.']},Conjugaison:{Concordance:['Les temps doivent rester cohérents entre les propositions.','Il a dit qu’il viendrait.']},Vocabulaire:{Argumentation:['Pour argumenter : affirmer, nuancer, justifier, contredire, démontrer.','Cet argument mérite d’être nuancé.']}},C1:{Grammaire:{Nuances:['À niveau avancé, les choix grammaticaux permettent de nuancer précisément une idée.','Bien qu’il soit tard, nous continuons.']},Conjugaison:{Litteraire:['Le passé simple est surtout fréquent dans les récits écrits.','Il entra dans la pièce.']},Vocabulaire:{Expressions:['Les expressions idiomatiques donnent naturel et précision au français.','Mettre les choses au clair = clarifier.']}}};const extra={Articles:[['___ livre est sur la table.','Le'],['J’ai ___ idée.','une'],['___ enfants jouent.','Les'],['Elle achète ___ pommes.','des'],['Il boit ___ eau.','de l’']],Négation:[['Je ___ comprends pas.','ne'],['Elle ne ___ pas ici.','vient'],['Nous ___ mangeons pas.','ne'],['Il n’aime ___ le café.','pas'],['Vous ne ___ pas tard.','serez']],Présent:[['Je ___ français.','parle'],['Nous ___ au cinéma.','allons'],['Tu ___ un livre.','lis'],['Ils ___ ici.','viennent'],['Elle ___ du piano.','joue']],Passé:[['J’___ mangé.','ai'],['Elle ___ partie.','est'],['Nous avons ___ le film.','vu'],['Ils sont ___ tôt.','arrivés'],['Tu as ___ la réponse.','trouvé']],Futur:[['Je vais ___.','travailler'],['Nous allons ___.','voir'],['Elle va ___ à Paris.','partir'],['Tu vas ___ tes devoirs.','faire'],['Ils vont ___.','arriver']],Imparfait:[['Quand j’étais petit, je ___.','jouais'],['Nous ___ souvent ici.','venions'],['Elle ___ beaucoup.','lisait'],['Vous ___ à Paris.','habitiez'],['Ils ___ ensemble.','travaillaient']],Comparaison:[['Paul est ___ grand que Marc.','plus'],['Ce livre est moins cher __ l’autre.','que'],['Elle est aussi rapide __ toi.','que'],['Ce trajet est ___ long.','plus'],['Il travaille moins __ son frère.','que']],Condition:[['Si j’avais le temps, je ___.','voyagerais'],['Si tu venais, nous ___.','sortirions'],['Si elle travaillait, elle ___.','réussirait'],['Si vous pouviez, vous ___.','aideriez'],['Si nous avions faim, nous ___.','mangerions']],Subjonctif:[['Il faut que tu ___.','viennes'],['Je veux qu’il ___.','réussisse'],['Bien qu’elle ___ fatiguée.','soit'],['Il faut que nous ___.','partions'],['Je doute qu’ils ___.','viennent']],Concordance:[['Il a dit qu’il ___.','viendrait'],['Elle pensait qu’il ___.','partirait'],['Il expliquait qu’il ___ malade.','était'],['Nous savions qu’ils ___.','arriveraient'],['Elle croyait qu’il ___.','comprendrait']]};let state=JSON.parse(localStorage.parleVous||'{}');state.xp=state.xp||0;state.done=state.done||0;state.errors=state.errors||[];let level='A1',theme='Grammaire',sub='Articles',questions=[],qi=0,score=0,locked=false;const save=()=>localStorage.parleVous=JSON.stringify(state);const xp=()=>document.getElementById('xp').textContent=state.xp;function home(){document.getElementById('title').textContent='Bonjour 👋';view.innerHTML='<section class="hero"><div><h2>Apprends le français. Vraiment.</h2><p>Leçons courtes, progression claire et exercices interactifs.</p></div><button class="btn" onclick="openSub(level,theme,sub)">Continuer →</button></section><div class="stats"><div class="stat"><span class="muted">XP total</span><b>'+state.xp+'</b></div><div class="stat"><span class="muted">Séries terminées</span><b>'+state.done+'</b></div><div class="stat"><span class="muted">Niveau</span><b>'+level+'</b></div><div class="stat"><span class="muted">Erreurs</span><b>'+state.errors.length+'</b></div></div><div class="sectionhead"><h2>Choisis ton niveau</h2></div><div class="filters">'+Object.keys(lessons).map(l=>'<button class="pill '+(l==level?'active':'')+'" onclick="chooseLevel(\''+l+'\')">'+l+'</button>').join('')+'</div><div class="sectionhead"><h2>Ton parcours</h2></div><div id="cards" class="grid"></div></section>';cards.innerHTML=Object.entries(lessons[level]).flatMap(([t,ss])=>Object.keys(ss).map(s=>'<article class="card" onclick="openSub(\''+level+'\',\''+t+'\',\''+s+'\')"><span class="tag">'+level+' · '+t+'</span><h3>'+s+'</h3><p class="muted">Leçon + 25 exercices</p></article>')).join('');xp()}function chooseLevel(l){level=l;theme=Object.keys(lessons[l])[0];sub=Object.keys(lessons[l][theme])[0];home()}function catalog(){home()}function openSub(l,t,s){level=l;theme=t;sub=s;const d=lessons[l][t][s];view.innerHTML='<div class="sectionhead"><div><span class="tag">'+l+' · '+t+'</span><h2>'+s+'</h2></div><button class="pill" onclick="home()">← Accueil</button></div><article class="lesson"><h3>📖 Leçon</h3><p>'+d[0]+'</p><div class="example"><b>Exemple :</b> '+d[1]+'</div><button class="btn" onclick="startQuiz()">Commencer 25 exercices →</button></article>'}function makeQs(){const base=extra[sub]||[['Choisis la réponse correcte.','Oui'],['Quelle réponse convient ?','Oui'],['Complète la phrase.','Oui'],['Quel choix est correct ?','Oui'],['Quelle proposition est correcte ?','Oui']];let out=[];for(let k=0;k<6;k++)base.forEach(x=>{let pool=base.map(y=>y[1]).filter(v=>v!==x[1]).sort(()=>Math.random()-.5);let a=[x[1],pool[0]||'Non',pool[1]||'Peut-être',pool[2]||'Jamais'].sort(()=>Math.random()-.5);out.push({q:x[0],a,c:x[1]})});return out.sort(()=>Math.random()-.5).slice(0,25)}function startQuiz(){questions=makeQs();qi=0;score=0;showQ()}function showQ(){locked=false;const q=questions[qi];view.innerHTML='<div class="sectionhead"><div><span class="tag">'+level+' · '+theme+' · '+sub+'</span><h2>Exercice '+(qi+1)+' / 25</h2></div><span class="muted">Score : '+score+'</span></div><article class="quiz"><div class="progress"><i style="width:'+(qi/25*100)+'%"></i></div><h2>'+q.q+'</h2><div class="answers">'+q.a.map(a=>'<button class="answer" onclick="answer(this,'+JSON.stringify(a)+')">'+a+'</button>').join('')+'</div><div id="feedback" class="feedback"></div><button id="next" class="btn hidden" onclick="nextQ()">'+(qi===24?'Voir mon résultat':'Continuer →')+'</button></article>'}function answer(btn,val){if(locked)return;locked=true;const q=questions[qi],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>{b.disabled=true;b.classList.add('locked');if(b.textContent===q.c)b.classList.add('good')});if(val===q.c){btn.classList.add('good');score++;state.xp++;feedback.textContent='✓ Correct ! +1 XP'}else{btn.classList.add('bad');feedback.textContent='✗ Incorrect. La bonne réponse est : '+q.c;state.errors.push({level,theme,sub,q:q.q,answer:q.c});state.errors=state.errors.slice(-30)}save();xp();document.getElementById('next').classList.remove('hidden')}function nextQ(){qi++;if(qi<25)showQ();else result()}function result(){state.done++;save();view.innerHTML='<article class="result"><span class="tag">SÉRIE TERMINÉE</span><h2>'+score+'/25 🎉</h2><p>Ton score final est de '+Math.round(score/25*100)+'%.</p><div class="row"><button class="btn" onclick="startQuiz()">Nouvelle série 🔀</button><button class="pill" onclick="home()">Retour à l’accueil</button></div></article>'}function mistakes(){view.innerHTML=state.errors.length?'<div class="sectionhead"><h2>Mes erreurs</h2></div><div class="grid">'+state.errors.slice().reverse().map(e=>'<article class="card"><span class="tag">'+e.level+' · '+e.theme+'</span><h3>'+e.q+'</h3><p>Bonne réponse : <b>'+e.answer+'</b></p></article>').join('')+'</div>':'<article class="lesson"><h2>🎯 Aucune erreur enregistrée</h2><p>Fais quelques exercices pour commencer ta révision.</p></article>'}function about(){view.innerHTML='<article class="lesson"><span class="tag">MÉTHODE</span><h2>Une progression simple</h2><p>1. Choisis ton niveau. 2. Lis une leçon. 3. Fais les exercices. 4. Regarde tes erreurs. 5. Recommence.</p></article>'}home();</script></body></html>
