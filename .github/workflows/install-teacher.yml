name: Install teacher mode

on:
  push:
    paths:
      - .github/workflows/install-teacher.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade index.html
        env:
          CSS: |
            .teacher-shell{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}.teacher-head{padding:22px;background:linear-gradient(135deg,#111735,#292e63);color:#fff;display:flex;justify-content:space-between;gap:15px;align-items:center}.teacher-head h2{margin:0}.teacher-nav{display:flex;gap:7px;overflow:auto;padding:10px;border-bottom:1px solid var(--line);background:#fafbff}.teacher-nav button{border:0;background:transparent;padding:10px 13px;border-radius:10px;font-weight:800;white-space:nowrap;cursor:pointer}.teacher-nav button.active{background:#5b5cf0;color:#fff}.teacher-body{padding:20px}.teacher-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.teacher-kpi{background:#f7f8fc;border:1px solid var(--line);border-radius:15px;padding:16px}.teacher-kpi b{font-size:27px;display:block}.teacher-table{width:100%;border-collapse:collapse}.teacher-table th,.teacher-table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.teacher-table th{font-size:12px;color:var(--muted);text-transform:uppercase}.teacher-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.teacher-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teacher-form input,.teacher-form select,.teacher-form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.teacher-form textarea{min-height:110px;grid-column:1/-1}.teacher-full{grid-column:1/-1}.teacher-chart{display:flex;align-items:end;gap:7px;height:180px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fafbff}.teacher-bar{flex:1;min-width:8px;background:#5b5cf0;border-radius:6px 6px 0 0;position:relative}.teacher-bar span{position:absolute;bottom:100%;font-size:10px;left:50%;transform:translateX(-50%);color:var(--muted)}.teacher-note{padding:12px;border-radius:12px;background:#fff8e8;border:1px solid #f0dfad}.danger{background:#fff0f1!important;color:#c52d3c!important}.small{font-size:12px}@media(max-width:850px){.teacher-kpis{grid-template-columns:1fr 1fr}.teacher-form{grid-template-columns:1fr}}@media(max-width:500px){.teacher-kpis{grid-template-columns:1fr}.teacher-head{align-items:flex-start;flex-direction:column}}
          JS: |
            const TKEY='parleVousTeacher';
            let teacherTab='dashboard';
            function teacherStore(){try{return JSON.parse(localStorage.getItem(TKEY)||'null')||{students:[],courses:[],tests:[]}}catch(e){return {students:[],courses:[],tests:[]}}}
            function saveTeacher(t){localStorage.setItem(TKEY,JSON.stringify(t))}
            function teacherLogin(){document.getElementById('view').innerHTML=`<div class="teacher"><span class="tag">Espace professeur</span><h2>Connexion professeur</h2><p class="muted">Accès local à l'administration de Parle-vous ?</p><input id="pass" type="password" placeholder="Mot de passe" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:11px"><br><br><button class="btn" onclick="checkTeacher()">Se connecter</button><p id="msg"></p></div>`;document.getElementById('pass').focus()}
            function checkTeacher(){if(document.getElementById('pass').value==='PRONOTE')teacherPanel();else document.getElementById('msg').textContent='Mot de passe incorrect.'}
            function teacherPanel(tab='dashboard'){teacherTab=tab;let t=teacherStore();document.getElementById('view').innerHTML=`<div class="teacher-shell"><div class="teacher-head"><div><span class="tag" style="background:#ffffff22;color:#fff">ADMINISTRATION</span><h2>Mode professeur</h2><p style="margin:6px 0 0;opacity:.75">Gère les élèves, cours, questions, contrôles et résultats.</p></div><button class="pill" onclick="home()">Quitter</button></div><div class="teacher-nav">${[['dashboard','📊 Tableau de bord'],['students','👥 Élèves'],['courses','📚 Cours'],['questions','❓ Questions'],['tests','📝 Contrôles'],['stats','📈 Statistiques'],['reports','📥 Rapports'],['settings','⚙️ Paramètres']].map(x=>`<button class="${teacherTab===x[0]?'active':''}" onclick="teacherPanel('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="teacher-body" id="teacherBody"></div></div>`;renderTeacherTab()}
            function renderTeacherTab(){let t=teacherStore(),b=document.getElementById('teacherBody');if(!b)return;
            if(teacherTab==='dashboard'){let err={};S.errors.forEach(e=>err[e.sub]=(err[e.sub]||0)+1);b.innerHTML=`<div class="teacher-kpis"><div class="teacher-kpi"><b>${t.students.length}</b>Élèves</div><div class="teacher-kpi"><b>${t.courses.length}</b>Cours personnalisés</div><div class="teacher-kpi"><b>${t.tests.length}</b>Contrôles créés</div><div class="teacher-kpi"><b>${S.done}</b>Séries réalisées</div></div><h3>Vue d'ensemble</h3><div class="grid"><div class="card"><b>XP actuel</b><h2>${S.xp}</h2><span class="muted">Progression du profil local actif</span></div><div class="card"><b>Erreurs enregistrées</b><h2>${S.errors.length}</h2><span class="muted">À utiliser pour cibler les révisions</span></div><div class="card"><b>Réussite estimée</b><h2>${S.done?Math.round(Math.max(0,S.xp)/(S.done*25)*100):0}%</h2><span class="muted">Indicateur basé sur les séries</span></div></div><h3>Thèmes à revoir</h3><div class="card">${Object.entries(err).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<p><b>${x[0]}</b> — ${x[1]} erreur(s)</p>`).join('')||'Aucune erreur pour le moment.'}</div><div class="teacher-note" style="margin-top:15px"><b>ℹ️ Données locales :</b> cette version permet une vraie administration dans le navigateur, mais elle ne synchronise pas encore les élèves entre plusieurs appareils. Pour cela, il faudra connecter une base de données et une authentification serveur.</div>`}
            else if(teacherTab==='students'){b.innerHTML=`<div class="sectionhead"><div><h2>Élèves</h2><p class="muted">Crée des profils locaux et suis leur progression.</p></div></div><div class="teacher-form"><input id="studentName" placeholder="Nom ou pseudo de l'élève"><input id="studentClass" placeholder="Classe / groupe"><button class="btn teacher-full" onclick="addStudent()">+ Ajouter l'élève</button></div><div style="overflow:auto;margin-top:20px"><table class="teacher-table"><tr><th>Élève</th><th>Classe</th><th>XP</th><th>Moyenne</th><th>Actions</th></tr>${t.students.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.cls||'—')}</td><td>${x.xp||0}</td><td>${x.avg||'—'}</td><td><button class="pill" onclick="studentDetails(${i})">Voir</button> <button class="pill danger" onclick="deleteStudent(${i})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="5">Aucun élève créé.</td></tr>'}</table></div>`}
            else if(teacherTab==='courses'){let levels=Object.keys(L);b.innerHTML=`<h2>Créer un cours</h2><div class="teacher-form"><input id="courseTitle" placeholder="Titre du cours"><select id="courseLevel">${levels.map(x=>`<option>${x}</option>`).join('')}</select><textarea id="courseText" placeholder="Contenu de la leçon..."></textarea><button class="btn teacher-full" onclick="addCourse()">+ Créer le cours</button></div><h3>Cours personnalisés</h3><div class="grid">${t.courses.map((x,i)=>`<div class="card"><span class="tag">${esc(x.level)}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.text).slice(0,160)}${x.text.length>160?'…':''}</p><button class="pill danger" onclick="deleteCourse(${i})">Supprimer</button></div>`).join('')||'<div class="card">Aucun cours personnalisé.</div>'}</div>`}
            else if(teacherTab==='questions'){b.innerHTML=`<h2>Banque de questions</h2><p class="muted">Le site contient déjà les banques A1 à C1. Ici tu peux ajouter des questions personnalisées.</p><div class="teacher-form"><input id="qTheme" placeholder="Thème"><input id="qCorrect" placeholder="Bonne réponse"><input id="qQuestion" class="teacher-full" placeholder="Question"><input id="qWrong1" placeholder="Mauvaise réponse 1"><input id="qWrong2" placeholder="Mauvaise réponse 2"><input id="qWrong3" placeholder="Mauvaise réponse 3"><button class="btn teacher-full" onclick="addQuestion()">+ Ajouter à la banque</button></div><h3>Questions personnalisées</h3><div style="overflow:auto"><table class="teacher-table"><tr><th>Thème</th><th>Question</th><th>Réponse</th><th></th></tr>${(t.questions||[]).map((x,i)=>`<tr><td>${esc(x.theme)}</td><td>${esc(x.q)}</td><td>${esc(x.c)}</td><td><button class="pill danger" onclick="deleteQuestion(${i})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="4">Aucune question personnalisée.</td></tr>'}</table></div>`}
            else if(teacherTab==='tests'){b.innerHTML=`<h2>Créateur de contrôles</h2><div class="teacher-form"><input id="testTitle" placeholder="Nom du contrôle"><select id="testLevel"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select><input id="testCount" type="number" min="5" max="50" value="20" placeholder="Questions"><input id="testDuration" type="number" min="5" value="30" placeholder="Durée en minutes"><button class="btn teacher-full" onclick="addTest()">+ Créer le contrôle</button></div><h3>Contrôles</h3><div class="grid">${t.tests.map((x,i)=>`<div class="card"><span class="tag">${x.level}</span><h3>${esc(x.title)}</h3><p>${x.count} questions · ${x.duration} min</p><button class="pill danger" onclick="deleteTest(${i})">Supprimer</button></div>`).join('')||'<div class="card">Aucun contrôle créé.</div>'}</div>`}
            else if(teacherTab==='stats'){let by={};S.errors.forEach(e=>by[e.level]=(by[e.level]||0)+1);b.innerHTML=`<h2>Statistiques</h2><div class="teacher-kpis"><div class="teacher-kpi"><b>${S.xp}</b>XP</div><div class="teacher-kpi"><b>${S.done}</b>Séries</div><div class="teacher-kpi"><b>${S.errors.length}</b>Erreurs</div><div class="teacher-kpi"><b>${Object.keys(by).length}</b>Niveaux travaillés</div></div><h3>Erreurs par niveau</h3><div class="teacher-chart">${['A1','A2','B1','B2','C1'].map(l=>{let n=by[l]||0,h=Math.min(100,10+n*8);return `<div class="teacher-bar" style="height:${h}%"><span>${n}</span></div>`}).join('')}</div><p class="muted small">Chaque barre correspond à A1, A2, B1, B2 puis C1.</p>`}
            else if(teacherTab==='reports'){b.innerHTML=`<h2>Rapports</h2><div class="grid"><div class="card"><h3>Exporter toutes les données</h3><p class="muted">Télécharge les données du profil et de l'administration.</p><button class="btn" onclick="exportAllTeacher()">📥 Exporter JSON</button></div><div class="card"><h3>Exporter les erreurs</h3><p class="muted">Crée un fichier CSV exploitable dans un tableur.</p><button class="btn" onclick="exportErrorsCSV()">📥 Exporter CSV</button></div></div><div class="card" style="margin-top:14px"><h3>Résumé</h3><p>${S.done} série(s), ${S.xp} XP et ${S.errors.length} erreur(s) enregistrée(s).</p></div>`}
            else if(teacherTab==='settings'){b.innerHTML=`<h2>Paramètres professeur</h2><div class="grid"><div class="card"><h3>💾 Sauvegarde</h3><p class="muted">Les profils et contenus personnalisés sont conservés dans ce navigateur.</p><button class="btn" onclick="exportAllTeacher()">Exporter une sauvegarde</button></div><div class="card"><h3>🧹 Réinitialisation</h3><p class="muted">Supprime les données d'administration locales.</p><button class="pill danger" onclick="resetTeacherData()">Réinitialiser le mode prof</button></div><div class="card"><h3>🔐 Sécurité</h3><p class="muted">Le mot de passe actuel est vérifié côté navigateur. Ce n'est pas une authentification sécurisée pour un vrai établissement.</p></div></div>`}}
            function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
            function addStudent(){let t=teacherStore(),n=document.getElementById('studentName').value.trim();if(!n)return alert('Entre un nom.');t.students.push({name:n,cls:document.getElementById('studentClass').value.trim(),xp:0,avg:null,created:new Date().toISOString()});saveTeacher(t);teacherPanel('students')}
            function deleteStudent(i){if(confirm('Supprimer cet élève ?')){let t=teacherStore();t.students.splice(i,1);saveTeacher(t);teacherPanel('students')}}
            function studentDetails(i){let t=teacherStore(),x=t.students[i];alert(`Élève : ${x.name}\nClasse : ${x.cls||'—'}\nXP : ${x.xp||0}\nMoyenne : ${x.avg||'—'}`)}
            function addCourse(){let t=teacherStore(),title=document.getElementById('courseTitle').value.trim(),text=document.getElementById('courseText').value.trim();if(!title||!text)return alert('Complète le titre et la leçon.');t.courses.push({title,text,level:document.getElementById('courseLevel').value});saveTeacher(t);teacherPanel('courses')}
            function deleteCourse(i){let t=teacherStore();t.courses.splice(i,1);saveTeacher(t);teacherPanel('courses')}
            function addQuestion(){let t=teacherStore();t.questions=t.questions||[];let q=document.getElementById('qQuestion').value.trim(),c=document.getElementById('qCorrect').value.trim();if(!q||!c)return alert('Complète la question et la bonne réponse.');t.questions.push({theme:document.getElementById('qTheme').value.trim()||'Personnalisé',q,c,w:[document.getElementById('qWrong1').value.trim(),document.getElementById('qWrong2').value.trim(),document.getElementById('qWrong3').value.trim()].filter(Boolean)});saveTeacher(t);teacherPanel('questions')}
            function deleteQuestion(i){let t=teacherStore();t.questions.splice(i,1);saveTeacher(t);teacherPanel('questions')}
            function addTest(){let t=teacherStore(),title=document.getElementById('testTitle').value.trim();if(!title)return alert('Donne un nom au contrôle.');t.tests.push({title,level:document.getElementById('testLevel').value,count:+document.getElementById('testCount').value||20,duration:+document.getElementById('testDuration').value||30});saveTeacher(t);teacherPanel('tests')}
            function deleteTest(i){let t=teacherStore();t.tests.splice(i,1);saveTeacher(t);teacherPanel('tests')}
            function exportAllTeacher(){let data={studentData:S,teacherData:teacherStore(),exportedAt:new Date().toISOString()};downloadText('parle-vous-sauvegarde.json',JSON.stringify(data,null,2),'application/json')}
            function exportErrorsCSV(){let rows=[['Niveau','Catégorie','Thème','Question','Réponse']].concat(S.errors.map(e=>[e.level,e.cat,e.sub,e.question,e.answer]));downloadText('parle-vous-erreurs.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')}
            function downloadText(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
            function resetTeacherData(){if(confirm('Supprimer tous les profils, cours, questions et contrôles personnalisés ?')){localStorage.removeItem(TKEY);teacherPanel('dashboard')}}
            save();home();
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css=os.environ["CSS"]
          js=os.environ["JS"]
          if ".teacher-shell{" not in s:
              s=s.replace("</style>", css+"\n</style>", 1)
          start=s.find("function teacherLogin(){")
          end=s.find("save();home();", start)
          if start < 0 or end < 0:
              raise SystemExit("teacher block not found")
          end += len("save();home();")
          s=s[:start]+js+s[end:]
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade professor mode"
          git push
          git rm .github/workflows/install-teacher.yml
          git commit -m "Remove one-time teacher upgrade workflow"
          git push
